# Start:  cp .env.example .env  &&  docker compose up -d
# Konzol: http://localhost:9001   S3 API: http://localhost:9000
# Stop:   docker compose down          (data remain)
#         docker compose down -v       (data deleted)
#
# NETWORK:
#     Between the containers are using the compose service name: http://minio:9000
#     Never use 127.0.0.1 between containers.

services:
  minio:
    image: coollabsio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Once init-container: create DVC store and exit
  create-bucket:
    build:
      context: .
      dockerfile: src/docker/Dockerfile
      network: host
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DVC_BUCKET: ${DVC_BUCKET}
      PYTHONUNBUFFERED: "1"
    restart: "no"

volumes:
  minio-data:
