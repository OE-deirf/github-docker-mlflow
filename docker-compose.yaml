# Start:  cp .env.example .env  &&  docker compose up -d
# Konzol: http://localhost:9001   S3 API: http://localhost:9000
# Stop:   docker compose down          (data remain)
#         docker compose down -v       (data deleted)
#
# NETWORK:
#     Between the containers are using the compose service name: http://minio:9000
#     Never use 127.0.0.1 between containers.

# reset containers
# docker compose run --rm dvc-cleanup
# docker compose down -v --remove-orphans
# docker image rm mlops:local


x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ENDPOINT_HOST: http://localhost:9000
  DVC_BUCKET: ${DVC_BUCKET:-dvc}
  DVC_REMOTE: ${DVC_REMOTE:-storage}
  NO_PROXY: minio,localhost
  PYTHONUNBUFFERED: "1"

services:
  minio:
    image: coollabsio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Once init-container: create DVC store and exit
  create-bucket:
    build:
      context: .
      dockerfile: src/docker/dvc_dockerfile
      network: host
    image: mlops:local
    pull_policy: never
    depends_on: [minio]
    environment: *minio-env
    restart: "no"

  # Once set dvc remote config and exit
  set-dvc-remote:
    image: mlops:local
    pull_policy: never
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment: *minio-env
    volumes: [".:/workspace"]
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        dvc remote add --local -d -f "$$DVC_REMOTE" "s3://$$DVC_BUCKET"
        # dvc remote modify --local "$$DVC_REMOTE" endpointurl "$$MINIO_ENDPOINT"
        dvc remote modify --local "$$DVC_REMOTE" endpointurl "$$MINIO_ENDPOINT_HOST"
        dvc remote modify --local "$$DVC_REMOTE" access_key_id $${MINIO_ROOT_USER};
        dvc remote modify --local "$$DVC_REMOTE" secret_access_key $${MINIO_ROOT_PASSWORD};
        dvc remote list --local
    restart: "no"

  dvc-cleanup:
    image: mlops:local
    pull_policy: never
    profiles: ["cleanup"]
    environment:
      <<: *minio-env
      HOME: /tmp
    volumes: [".:/workspace"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - dvc remote remove --local "$$DVC_REMOTE" || true

volumes:
  minio-data:
